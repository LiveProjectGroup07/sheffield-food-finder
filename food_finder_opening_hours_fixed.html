  const dayInput=document.getElementById('day');
  const hourInput=document.getElementById('hour');
  const timeFilter=document.getElementById('timeFilter');
  const includeUnknown=document.getElementById('includeUnknown');
  for(let h=0;h<24;h++)for(const m of [0,30]){const minutes=h*60+m;const o=document.createElement('option');o.value=String(minutes);o.textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');hourInput.appendChild(o);}
  const weekdays=['mon','tue','wed','thu','fri','sat','sun'];
  function matchesOpening(i){
    if(!timeFilter.checked)return true;
    const f=openingData[i];
    if(!f||f.status==='unknown')return includeUnknown.checked;
    if(f.status==='temporarily_closed')return false;
    const day=dayInput.value;const idx=weekdays.indexOf(day);
    const today=f.hours[day]||[];
    const previous=f.hours[weekdays[(idx+6)%7]]||[];
    if(hourInput.value==='any')return today.length>0||previous.some(r=>r[1]>1440);
    const t=Number(hourInput.value);
    return today.some(r=>t>=r[0]&&t<r[1])||previous.some(r=>t+1440>=r[0]&&t+1440<r[1]);
  }
 for(const c of cats){groups[c]=viewer.entities.add(new Cesium.Entity({name:c}));const label=document.createElement('label');const check=document.createElement('input');check.type='checkbox';check.checked=true;check.dataset.category=c;const dot=document.createElement('span');dot.style.cssText='background:'+colors[c]+';width:11px;height:11px;border-radius:50%;flex:none';const text=document.createElement('span');text.textContent=c+' ('+places.filter(p=>p.category===c).length+')';label.append(check,dot,text);document.getElementById('filters').append(label);}
 for(const [placeIndex,p] of places.entries()){if(p.polygon){const entity=viewer.entities.add({name:p.name,parent:groups[p.category],polygon:{hierarchy:Cesium.Cartesian3.fromDegreesArray(p.polygon.flat()),material:Cesium.Color.fromCssColorString(colors[p.category]).withAlpha(0.5),outline:true,outlineColor:Cesium.Color.fromCssColorString(colors[p.category]),height:8},description:infoHtml(p)});placeEntities.push({p,entity,placeIndex});continue;}const entity=viewer.entities.add({name:p.name,parent:groups[p.category],position:Cesium.Cartesian3.fromDegrees(p.lon,p.lat,0),billboard:{image:makePin(colors[p.category]),width:22,height:30,verticalOrigin:Cesium.VerticalOrigin.BOTTOM,pixelOffset:new Cesium.Cartesian2(0,-14),heightReference:Cesium.HeightReference.CLAMP_TO_3D_TILE,disableDepthTestDistance:Number.POSITIVE_INFINITY},description:infoHtml(p)});placeEntities.push({p,entity,placeIndex});}
  function infoHtml(p){
    const i=places.indexOf(p);const f=openingData[i];
    const details=p.detail?'<h4>Additional information</h4><p>'+escapeHtml(p.detail).replace(/&lt;br\s*\/?&gt;/gi,'<br>')+'</p>':'';
    const address=f?.address?'<p><strong>Address:</strong> '+escapeHtml(f.address)+'</p>':'';
    const hours=f?.raw?'<p><strong>Opening hours (supplied data):</strong><br>'+escapeHtml(f.raw).replace(/\n/g,'<br>')+'</p>':'<p><em>Opening hours not recorded.</em></p>';
    return '<p><strong>Category:</strong> '+escapeHtml(p.category)+'</p>'+address+hours+details;
  }

 function update(){
   const selected=new Set([...document.querySelectorAll('#filters input:checked')].map(cb=>cb.dataset.category));
   let count=0;
   for(const c of cats)groups[c].show=selected.has(c);

 }
